name: Validate phase-gated work contracts

on:
  pull_request:
  push:
    branches: [main, task_a/roy2]
  workflow_dispatch:

jobs:
  phase-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate analysis / development / client verification stages
        run: python3 tools/validate-phase-gates.py
      - name: Validate A-024 decoded world-object packet layouts
        run: |
          python3 -m unittest discover -s task_a/roy2 -p 'test_a024_object_packets.py' -v
          python3 -m unittest discover -s task_a/roy2 -p 'test_a024_npc_codec.py' -v
      - name: Validate A-011 monster resource, click and motion mappings
        run: |
          python3 -m unittest discover -s task_a/roy2 -p 'test_a011_resource.py' -v
      - name: Validate A-015 MAP geometry and collision evidence
        run: |
          python3 -m unittest discover -s task_a/roy2 -p 'test_a015_map_coordinate.py' -v
